# CI: 在 macOS、Ubuntu、Windows 上运行测试，验证跨平台兼容性
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts tests/ 2>/dev/null || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts tests/ 2>/dev/null || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts tests/

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  test-linux-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium
        timeout-minutes: 5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts tests/ 2>/dev/null || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Bun)
        run: bun test tests/

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium
        timeout-minutes: 5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts tests/ 2>/dev/null || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Bun, macOS)
        run: bun test tests/

  test-windows-bun:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium (Windows)
        run: bunx playwright install chromium
        timeout-minutes: 10

      - name: Verify Chromium in PLAYWRIGHT_BROWSERS_PATH (Windows)
        shell: pwsh
        run: |
          $path = "$env:PLAYWRIGHT_BROWSERS_PATH"
          Write-Host "PLAYWRIGHT_BROWSERS_PATH=$path"
          if (-not (Test-Path $path)) { Write-Error "Path not found: $path"; exit 1 }
          Get-ChildItem -Path $path -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $?) { Write-Error "chrome.exe not found under $path"; exit 1 }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts tests/

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      # Windows 上浏览器测试由上方 test-windows (Deno) 覆盖。
      # Bun 在 Windows 存在已知 bug（chromium.launch() 卡住不返回，见 oven-sh/bun#15679）
      # 即使 PLAYWRIGHT_BROWSERS_PATH 与 Chromium 已正确安装也会 120s 超时，
      # 故此处仅跑非 browser 用例；待 Bun 修复后可改为 bun test tests/
      - name: Test (Bun, Windows)
        shell: pwsh
        run: |
          $nonBrowser = Get-ChildItem -Path tests -Filter "*.test.ts" -File | ForEach-Object { "tests/" + $_.Name }
          bun test @nonBrowser
        timeout-minutes: 10

  # ─────────────────────────────────────────────────────────────
  # Node.js 三端测试
  # test:node 脚本：tsx --tsconfig tsconfig.json --test tests/*.test.ts
  #   - tsx 作为 TypeScript loader，驱动 Node 原生 node:test runner
  #   - 仅跑 tests/*.test.ts（非 browser 用例），browser 用例依赖 @dreamer/esbuild
  #     其 JSR npm 版传递依赖旧 runtime-adapter，在 Node 暂跳过
  #   - runtime-adapter 1.2.0 已发布至 JSR 且含 IS_NODE，npm install 直接解析
  # ─────────────────────────────────────────────────────────────
  test-linux-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node)
        run: npm run test:node
        timeout-minutes: 10

  test-macos-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node, macOS)
        run: npm run test:node
        timeout-minutes: 10

  test-windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      # Node 原生 node:test runner（v21+）支持 glob 模式匹配，
      # tsx 将 --test 与 tests/*.test.ts 透传给 node，由 node 展开 glob，
      # 无需依赖 shell 通配符，Windows cmd.exe 不展开 * 亦无影响。
      - name: Test (Node, Windows)
        run: npm run test:node
        timeout-minutes: 10
