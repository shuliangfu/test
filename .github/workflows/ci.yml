# CI: 9-job matrix — Deno v2.9 + Bun + Node 22 × Linux/macOS/Windows
# Browser tests run on Deno and Bun (including Windows Bun; watch bun#15679).
# Node CI still runs npm run test:node only (browser skipped, same as before).
# Linux: ubuntu-24.04 (not ubuntu-latest=26.04); Playwright 1.59.1 lacks chromium for 26.04 — same as ui-view/dweb.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        id: setup-deno
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Deno (retry)
        if: steps.setup-deno.outcome == 'failure'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium (Linux + system deps)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.59.1 install chromium

      - name: Test (Bun — unit + browser)
        run: bun test tests/

  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node)
        run: npm run test:node
